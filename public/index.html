<div style="text-align: center; margin: 30px auto; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 500px; padding: 15px;">
  <h2 style="color: #fff; margin-bottom: 8px;">🍹 Nightzone - Test Pay 5 UIDs</h2>
  <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;">Kích hoạt thanh toán thưởng hàng loạt qua Backend API</p>
  
  <button id="payBtn" onclick="triggerPay5Uid()" style="width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background: linear-gradient(135deg, #7b2cbf, #9d4edd); color: white; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4); transition: all 0.3s ease;">
    🚀 Chạy Pay 5 UIDs ngay
  </button>

  <!-- Khu vực hiển thị kết quả trực quan -->
  <div id="resultStatus" style="margin-top: 20px;"></div>
</div>

<script>
  async function triggerPay5Uid() {
    const btn = document.getElementById('payBtn');
    const statusBox = document.getElementById('resultStatus');
    
    btn.innerText = "⏳ Đang xử lý giao dịch...";
    btn.disabled = true;
    statusBox.innerHTML = `
      <div style="padding: 15px; background: #2a2a3a; color: #e0e0e0; border-radius: 10px; font-size: 14px;">
        🔄 Đang kết nối Serverless Function & gọi Pi Network...
      </div>`;

    try {
      const response = await fetch('/api/pay5uid', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      
      const textData = await response.text();
      let data;
      try { data = JSON.parse(textData); } catch (e) {}

      if (!data || !data.results) {
        statusBox.innerHTML = `<div style="padding: 15px; background: #3d0000; color: #ff6b6b; border-radius: 10px;">❌ Lỗi Server: ${textData.slice(0, 150)}</div>`;
        return;
      }

      // Tạo giao diện danh sách kết quả đẹp mắt
      let cardsHtml = `<div style="margin-top: 10px; text-align: left;">`;
      cardsHtml += `<div style="color: #00ffcc; font-weight: bold; margin-bottom: 10px; text-align: center;">✅ Kết quả gửi thưởng (${data.total} Pioneer):</div>`;

      data.results.forEach((item, index) => {
        const isSuccess = item.success;
        const uidShort = item.uid ? item.uid.substring(0, 8) + '...' : 'Unknown';
        const amount = item.pi_response?.amount || 1;
        const memo = item.pi_response?.memo || 'Nightzone Reward';

        cardsHtml += `
          <div style="background: ${isSuccess ? '#1b2e2b' : '#3d1b1b'}; border-left: 5px solid ${isSuccess ? '#00e676' : '#ff5252'}; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #fff;">
              <span>👤 #${index + 1} UID: ${uidShort}</span>
              <span style="background: ${isSuccess ? '#00e676' : '#ff5252'}; color: #000; padding: 2px 8px; border-radius: 12px; font-size: 12px;">
                ${isSuccess ? 'THÀNH CÔNG' : 'THẤT BẠI'}
              </span>
            </div>
            <div style="font-size: 13px; color: #bbb; margin-top: 5px;">
              <div>💰 Số lượng: <b>${amount} Pi</b></div>
              <div>📝 Memo: <i>${memo}</i></div>
            </div>
          </div>
        `;
      });

      cardsHtml += `</div>`;
      statusBox.innerHTML = cardsHtml;

    } catch (error) {
      statusBox.innerHTML = `<div style="padding: 15px; background: #3d0000; color: #ff6b6b; border-radius: 10px;">❌ Lỗi kết nối mạng: ${error.message}</div>`;
    } finally {
      btn.innerText = "🚀 Chạy Pay 5 UIDs ngay";
      btn.disabled = false;
    }
  }
</script>
